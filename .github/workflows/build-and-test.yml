name: Build and Test

# Runs on every push to every branch and on pull requests. The release workflow only builds when
# semantic-release finds a releasable commit (feat, fix, ...), so a chore or docs commit would
# otherwise never be built or tested.
on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        shell: pwsh
        run: dotnet build .\epi-axis-camera.4Series.sln /p:Platform="Any CPU" /p:Configuration=Release -m

      - name: Run unit tests
        shell: pwsh
        run: dotnet test .\epi-axis-camera.4Series.sln --no-build /p:Platform="Any CPU" /p:Configuration=Release --logger "trx;LogFileName=test-results.trx" --results-directory .\TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 30
